<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Login</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #07111f;
        color: #e8eff8;
        font:
          16px system-ui,
          sans-serif;
        padding: 20px;
      }
      .card {
        width: min(420px, 100%);
        background: #0e1b2c;
        border: 1px solid #24364d;
        border-radius: 18px;
        padding: 28px;
      }
      h1 {
        margin-top: 0;
      }
      p {
        color: #9aacc2;
      }
      label {
        display: block;
        margin: 16px 0 6px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        border-radius: 9px;
        border: 1px solid #344961;
        background: #091522;
        color: white;
      }
      button {
        margin-top: 20px;
        width: 100%;
        padding: 12px;
        background: #42d6c5;
        border: 0;
        border-radius: 9px;
        font-weight: 800;
        cursor: pointer;
      }
      .flash {
        padding: 10px;
        background: #142c3c;
        border-radius: 8px;
        margin: 10px 0;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Admin sign in</h1>
      <p>Manage submitted comments.</p>
      {% with messages = get_flashed_messages(with_categories=true) %}{% for
      category,message in messages %}
      <div class="flash">{{ message }}</div>
      {% endfor %}{% endwith %}
      <form method="post">
        <input
          type="hidden"
          name="csrf_token"
          value="{{ csrf_token }}"
        /><label for="username">Username</label
        ><input
          id="username"
          name="username"
          required
          autocomplete="username"
        /><label for="password">Password</label
        ><input
          id="password"
          name="password"
          type="password"
          required
          autocomplete="current-password"
        /><button type="submit">Sign in</button>
      </form>
      <p>
        <a href="{{ url_for('index') }}" style="color: #42d6c5"
          >← Back to blog</a
        >
      </p>
    </main>
  </body>
</html>
